[[mods]]
modId="ae2tetraplus"
version="1.0.0"
displayName="AE Tetra Plus"
authors="YingOvO"
description='''
AE Tetra 的扩展：给模块化存储磁盘增加「存储类型」槽。

可在物品 / 流体 / 魔力（AppliedBotanics）/ 能量（AppliedFlux）/ 空气（AppliedPneumatics）/ 全类型之间切换，
切换类型时按规则裁剪旧数据（转为全类型不清空；从全类型转出只保留匹配类型）。
未安装对应扩展模组时，对应的核心选项会自动隐藏。
'''

