plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // libs/ 里放：appliedenergistics2-*.jar、tetra-*.jar、AE Tetra-*.jar
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : "skymirror",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : "skymirror",
                "MixinConfigs"          : "ae2tetraplus.mixins.json"
        ])
    }
}
